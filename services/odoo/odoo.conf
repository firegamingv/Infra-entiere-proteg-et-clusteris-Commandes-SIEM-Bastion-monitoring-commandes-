# OSTRAL — Lot C — configuration Odoo 17 (Z3) — GABARIT
# Rendu au démarrage par render_conf.py vers /run/odoo/odoo.conf (tmpfs, conteneur en lecture seule) :
# les variables (syntaxe dollar-accolades) sont remplacées par l'environnement ; les secrets ne sont donc ni dans l'image
# ni dans git (E12). admin_passwd est écrit HACHÉ (pbkdf2-sha512).
[options]
; --- F06 : base PostgreSQL en Z4, compte de service dédié ------------------------------------
db_host = erp-db
db_port = 5432
db_user = ${ERP_DB_USER}
db_password = ${ERP_DB_PASSWORD}
db_name = ${ODOO_DB}
db_sslmode = prefer
db_maxconn = 32

; --- Gestionnaire de bases neutralisé (F05) : une seule base, pas de listing / création web ----
dbfilter = ^${ODOO_DB}$$
list_db = False
admin_passwd = ${ODOO_ADMIN_PASSWD_HASH}
without_demo = all

; --- HTTP : derrière le WAF (F05) ; aucun port publié sur l'hôte ------------------------------
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
proxy_mode = True

; --- Processus : mode multi-workers (limites contre l'épuisement de ressources) ---------------
workers = ${ODOO_WORKERS}
max_cron_threads = 1
limit_memory_soft = 671088640
limit_memory_hard = 939524096
limit_request = 8192
limit_time_cpu = 120
limit_time_real = 240

; --- Données (filestore, sessions) : volume odoo_data ----------------------------------------
data_dir = /var/lib/odoo

; --- E08 : journaux applicatifs dans le volume logs_odoo (lu par le SIEM) ---------------------
logfile = ${ODOO_LOGFILE}
log_level = info
log_handler = :INFO,odoo.addons.base.models.res_users:INFO,odoo.addons.auth_ldap:INFO
syslog = False
