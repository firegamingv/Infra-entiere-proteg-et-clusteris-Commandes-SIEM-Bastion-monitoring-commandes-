# OSTRAL — lot D — rsyslog minimal d'admin-target (E08)
# Écrit les journaux d'authentification au format syslog traditionnel
# ("Oct 19 10:00:00 admin-target sshd-session[42]: Accepted publickey ...") compris par
# les décodeurs sshd de Wazuh, dans le volume logs_admin_target.
global(workDirectory="/run/rsyslog")
module(load="imuxsock" SysSock.Name="/dev/log")

$FileCreateMode 0640
$DirCreateMode 0750
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

auth,authpriv.*                 /var/log/admin-target/auth.log
*.info;auth,authpriv.none       /var/log/admin-target/messages.log
