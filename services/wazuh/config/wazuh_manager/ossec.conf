<!--
  OSTRAL — configuration du Wazuh manager (Z7, 10.10.7.20), dérivée de wazuh-docker 4.14.4 single-node.
  - E08 : collecte centralisée des journaux de toutes les zones ; alertes consultables 3 mois
          (politique ISM de l'indexer) ; archives brutes 12 mois (logall_json, copiées chaque
          nuit vers le stockage verrouillé par le service backup).
  - F11 : en maquette, les journaux des conteneurs sont lus directement par le manager dans les
          volumes logs_* montés en lecture seule sous /var/log/ostral/<service>/ (équivalent des
          agents). Ports agents 1514/1515 ouverts dans Z7 pour de vrais agents.
  - Seuil d'alerte (p. 12) : niveau >= 10 => SMS d'astreinte ; niveaux 7-9 => e-mail.
  - Le SIEM utilise des comptes LOCAUX (API wazuh-wui, base interne de l'indexer), sans lien avec l'AD.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <!-- E08 : TOUS les événements reçus sont archivés dans /var/ossec/logs/archives/archives.json
         (rotation quotidienne, compression). Volume wazuh_logs, sauvegardé chaque nuit par backup
         vers le dépôt restic puis le stockage objet verrouillé (Object Lock 30 j), rétention 12 mois. -->
    <logall_json>yes</logall_json>
    <!-- Pas de relais SMTP dans la maquette : en cible, e-mail aux 2 administrateurs d'astreinte -->
    <email_notification>no</email_notification>
    <smtp_server>smtp.ostral.internal</smtp_server>
    <email_from>wazuh@ostral.local</email_from>
    <email_to>astreinte@ostral.local</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <white_list>127.0.0.1</white_list>
    <white_list>^localhost.localdomain$</white_list>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <!-- Seuil SMS/e-mail d'astreinte du dossier (p. 12) : niveau >= 10 -->
    <email_alert_level>10</email_alert_level>
  </alerts>

  <!--
    Notification SMS d'astreinte (niveau >= 10) : en cible, intégration vers la passerelle SMS
    de l'opérateur. Exemple (script custom-sms à déposer dans /var/ossec/integrations) :
    <integration>
      <name>custom-sms</name>
      <hook_url>https://sms.fournisseur.example/api/send</hook_url>
      <level>10</level>
      <alert_format>json</alert_format>
    </integration>
  -->

  <logging>
    <log_format>plain</log_format>
  </logging>

  <!-- F11 : réception des agents (TCP 1514, chiffré) — joignable dans Z7 uniquement -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>
    <java_path>wodles/java</java_path>
    <ciscat_path>wodles/ciscat</ciscat_path>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- Z7 n'a pas d'accès Internet (réseau interne) : les flux CTI de vulnérabilités ne peuvent
       pas être téléchargés. Désactivé en maquette (en cible : via le proxy de sortie). -->
  <vulnerability-detection>
    <enabled>no</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://10.10.7.21:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/filebeat.pem</certificate>
      <key>/etc/ssl/filebeat.key</key>
    </ssl>
  </indexer>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
    <directories>/etc,/usr/bin,/usr/sbin</directories>
    <directories>/bin,/sbin,/boot</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>
    <nodiff>/etc/ssl/private.key</nodiff>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <max_eps>100</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_interval>1h</max_interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>restart-wazuh</name>
    <executable>restart-wazuh</executable>
  </command>

  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- ===================================================================== -->
  <!-- Collecte des journaux des zones (E08, F11) — volumes en lecture seule  -->
  <!-- Les lignes JSON sont décodées par le décodeur json natif de Wazuh.     -->
  <!-- ===================================================================== -->

  <!-- Z2 WAF (lot B) : access log JSON (status 403/429, client_ip), audit ModSecurity JSON, erreurs nginx -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/ostral/waf/waf_access.json</location>
    <label key="ostral_zone">Z2</label>
  </localfile>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/ostral/waf/modsec_audit.json</location>
    <label key="ostral_zone">Z2</label>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ostral/waf/waf_error.log</location>
  </localfile>

  <!-- Z1 boutique (lot A) : JSON lignes (event=login_failed, ip, email...) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/ostral/boutique/app.log</location>
    <label key="ostral_zone">Z1</label>
  </localfile>

  <!-- Z3 ERP Odoo (lot C) : journal texte (Login failed / successful) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ostral/odoo/odoo.log</location>
  </localfile>

  <!-- Z4 PostgreSQL ERP (lot C) : connexions, déconnexions, DDL -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ostral/erp-db/postgresql-%Y-%m-%d.log</location>
  </localfile>

  <!-- Z5 Samba AD (lot C) : audit auth/dsdb/groupes, variantes JSON (ajouts aux groupes d'administrateurs) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ostral/samba/samba.log</location>
  </localfile>

  <!-- Z6 bastion Guacamole (lot D) : ouvertures de session, échecs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ostral/guacamole/*.log</location>
  </localfile>

  <!-- Z3 serveur cible d'administration (lot D) : authentifications SSH, sudo -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ostral/admin-target/auth.log</location>
  </localfile>

  <!-- Z6/FW1 WireGuard (lot D) : refus journalisés OSTRAL-FW1-DROP-*, poignées de main -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ostral/wireguard/*.log</location>
  </localfile>

  <!-- Z7 sauvegarde (lot E) : une ligne JSON par tâche, status OK/ECHEC (règle « 0 erreur », E09) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/ostral/backup/backup.json</location>
    <label key="ostral_zone">Z7</label>
  </localfile>

  <!-- Occupation disque du manager (seuil e-mail > 85 %, p. 12) -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <!-- Règles et décodeurs OSTRAL (etc/rules/local_rules.xml, etc/decoders/local_decoder.xml) -->
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <!-- F11 : enrôlement des agents (TCP 1515). En cible : use_password=yes (authd.pass hors git). -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key>ostral0maquette0cluster0disabled</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>wazuh-manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>
</ossec_config>
