# OSTRAL — Lot C — pg_hba.conf de erp-db (Z4)
# F06 : seul l'ERP (compte de service `odoo`, 10.10.4.10 + son init 10.10.4.12) accède à la base ; E05 : aucune autre source.
# F16/E09 : la sauvegarde en mode pull (10.10.4.40, rôle lecture seule `backup_ro`) est la seule exception.
# Tout le reste est refusé (règle finale `reject`). Mots de passe exclusivement en scram-sha-256.
#
# TYPE  DATABASE        USER        ADDRESS            METHOD

# Administration locale dans le conteneur uniquement (socket Unix, utilisateur système postgres).
local   all             postgres                       peer

# F06 — Odoo : base `ostral` + base `postgres` (Odoo s'y connecte au démarrage pour vérifier
# l'existence de sa base ; il n'a pas CREATEDB, il ne peut donc rien y créer).
host    ostral          odoo        10.10.4.10/32      scram-sha-256
host    postgres        odoo        10.10.4.10/32      scram-sha-256
# Service one-shot `odoo-init` (même image et même compte de service que l'ERP, F06) :
# installation des modules / configuration, puis arrêt. Adresse dédiée 10.10.4.12.
host    ostral          odoo        10.10.4.12/32      scram-sha-256
host    postgres        odoo        10.10.4.12/32      scram-sha-256

# F16/E09 — sauvegarde (lot E) : lecture seule. `postgres` permet un pg_dumpall --globals-only
# --no-role-passwords si souhaité.
host    ostral          backup_ro   10.10.4.40/32      scram-sha-256
host    postgres        backup_ro   10.10.4.40/32      scram-sha-256

# Refus explicite de tout le reste (journalisé grâce à log_connections).
local   all             all                            reject
host    all             all         0.0.0.0/0          reject
host    all             all         ::/0               reject
