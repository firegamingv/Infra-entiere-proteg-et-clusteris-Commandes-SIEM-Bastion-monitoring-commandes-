# OSTRAL — Lot C — paramètres [global] durcis du DC OSTRAL.LOCAL (inclus depuis smb.conf)
# Fichier embarqué dans l'image : toute modification est appliquée au prochain redémarrage,
# sans re-provisionner le domaine. Références : F08 (ports d'authentification uniquement),
# S3 (annuaire = actif le plus critique), E08/E12 (journaux, durcissement).

# --- F08 : réduction de la surface réseau -------------------------------------------------
# Pas de NetBIOS (137/138/139) ; SMB uniquement sur 445 (SYSVOL/NETLOGON pour les postes Z8).
disable netbios = yes
smb ports = 445
# Les ports 135 (RPC), 464 (kpasswd), 3268/3269 (catalogue global) restent ouverts par le DC
# lui-même : ils ne sont joignables que depuis z5_identity (cloisonnement par réseau, FW2).

# --- Protocoles et authentification -------------------------------------------------------
server min protocol = SMB2_10
client min protocol = SMB2_10
server signing = mandatory
ntlm auth = ntlmv2-only
restrict anonymous = 2
# Pas de liaison LDAP simple en clair : obligation de TLS (LDAPS 636 ou STARTTLS 389) ou de signature
ldap server require strong auth = yes

# --- TLS (LDAPS 636 / STARTTLS 389) : certificat généré par l'entrypoint (AC interne AD) ----
tls enabled = yes
tls keyfile = /var/lib/samba/ad/private/tls/key.pem
tls certfile = /var/lib/samba/ad/private/tls/cert.pem
tls cafile = /var/lib/samba/ad/private/tls/ca.pem
tls priority = NORMAL:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1

# --- DNS interne AD : seules les requêtes hors zone sont relayées au résolveur Docker -------
# (z5_identity est un réseau interne : aucune sortie Internet possible.)
dns forwarder = 127.0.0.11

# --- Journalisation pour le SIEM (E08, tableau de journalisation du dossier) ----------------
# Connexions / échecs (auth_audit), créations et modifications de comptes (dsdb_audit),
# changements de mot de passe (dsdb_password_audit), ajouts aux groupes, notamment
# d'administrateurs (dsdb_group_audit). Variantes *_json_audit = lignes JSON pour Wazuh.
log file = /var/log/samba/samba.log
max log size = 51200
debug hires timestamp = yes
log level = 1 auth_audit:3 auth_json_audit:3 dsdb_audit:3 dsdb_json_audit:3 dsdb_password_audit:3 dsdb_password_json_audit:3 dsdb_group_audit:3 dsdb_group_json_audit:3
